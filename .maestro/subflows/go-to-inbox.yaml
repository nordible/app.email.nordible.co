# Back to the inbox list, from wherever in the Mail tab.
appId: co.nordible.mail
---
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- runFlow:
    file: go-to-folder.yaml
    env:
      FOLDER: Inbox
- extendedWaitUntil:
    visible:
      id: email-row
    timeout: 60000
