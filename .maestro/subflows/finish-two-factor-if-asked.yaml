# Some routes hand the app a password for a TOTP account; the app then asks
# for a code itself. Answer it when it shows up.
appId: co.nordible.mail
---
- extendedWaitUntil:
    visible: "Authentication code|Inbox"
    timeout: 90000
- runFlow:
    when:
      visible: "Authentication code"
    commands:
      - runFlow: two-factor.yaml
