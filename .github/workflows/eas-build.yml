name: EAS Build (Backup)

# Uses Expo Application Services (EAS Build) as a cloud build backup when
# GitHub-hosted macOS runners are saturated. Runs on ubuntu-latest and delegates
# native compilation to Expo's infrastructure.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options:
          - ios
          - android
          - all
        default: ios
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - production
          - preview
        default: production
      auto_submit:
        description: "Submit to App Store / Google Play upon completion"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set in GitHub repository secrets. Please generate a token from https://expo.dev/settings/access-tokens and add it to GitHub Repo Settings > Secrets and variables > Actions as EXPO_TOKEN."
            exit 1
          fi
          SUBMIT_FLAG=""
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive $SUBMIT_FLAG
